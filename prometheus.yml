global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  # Métricas propias del sensor SafeKitchen (/metrics en puerto 8000)
  - job_name: 'safekitchen_sensor'
    static_configs:
      - targets: ['host.docker.internal:8000']

  # Métricas del host / VM (CPU, memoria, disco, red)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Métricas de los contenedores Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
      