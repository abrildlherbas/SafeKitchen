services:
  grafana:
    image: grafana/grafana:latest
    container_name: safe-kitchen-grafana
    ports:
      - "3001:3000"
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: